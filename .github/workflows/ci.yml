name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: action-setup reads it from packageManager in the
      # root package.json, so CI and local machines stay in step.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build FIRST: playground and storybook import flowrap as a package, so
      # `exports` sends them to dist/ — which isn't in git. Type-checking them
      # before the build fails with "Cannot find module 'flowrap'".
      - run: pnpm --filter flowrap build
      - run: pnpm -r lint
      - run: pnpm -r check
      - run: pnpm -r test
      # Storybook builds from dist, which also catches broken stories
      - run: pnpm --filter flowrap-storybook build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter flowrap build # the playground links against dist
      - run: pnpm --filter playground build
      - run: pnpm exec playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
