<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="flowrap — a wrapper-first flow board for Svelte 5">
  <title>flowrap — a wrapper-first flow board for Svelte 5</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#cbd5e1" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#f1f5f9" />
  <rect width="1280" height="640" fill="url(#dots)" />

  <!-- mark -->
  <g transform="translate(96, 92) scale(1.5)">
    <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <path d="M1 11 C 6 11, 6 24, 11 24" />
      <path d="M37 24 C 42 24, 42 37, 47 37" />
    </g>
    <rect x="11" y="12" width="26" height="24" rx="7" fill="none" stroke="#2563eb" stroke-width="3" />
    <g fill="#ffffff" stroke="#2563eb" stroke-width="3">
      <circle cx="11" cy="24" r="3.5" />
      <circle cx="37" cy="24" r="3.5" />
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="96" y="287" font-size="96" font-weight="700" letter-spacing="-3" fill="#0f172a">flow<tspan fill="#2563eb">rap</tspan></text>
    <text x="99" y="347" font-size="32" font-weight="500" fill="#475569">A wrapper-first flow board for Svelte 5</text>
    <text x="99" y="395" font-size="23" fill="#64748b">Wrap the component you already have — get drag, zoom, pan, ports and links.</text>

    <g font-size="20" fill="#475569">
      <g transform="translate(99, 459)">
        <circle cx="0" cy="-6" r="4" fill="#2563eb" /><text x="18" y="0">Headless CSS</text>
      </g>
      <g transform="translate(299, 459)">
        <circle cx="0" cy="-6" r="4" fill="#7c3aed" /><text x="18" y="0">You own the graph</text>
      </g>
      <g transform="translate(563, 459)">
        <circle cx="0" cy="-6" r="4" fill="#059669" /><text x="18" y="0">Zero runtime dependencies</text>
      </g>
    </g>

    <text x="99" y="527" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">pnpm add flowrap</text>
  </g>

  <!-- a tiny board, the thing itself -->
  <g transform="translate(800, 240)">
    <g fill="none" stroke="#94a3b8" stroke-width="2.5">
      <path d="M164 62 C 204 62, 196 168, 236 168" />
      <path d="M164 62 C 200 62, 204 -34, 240 -34" />
    </g>
    <g>
      <rect x="8" y="34" width="156" height="58" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="8" y="34" width="4" height="58" rx="2" fill="#2563eb" />
      <text x="34" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Webhook</text>
      <text x="34" y="80" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">POST /api/orders</text>
      <circle cx="164" cy="62" r="6" fill="#fff" stroke="#2563eb" stroke-width="2.5" />
    </g>
    <g>
      <rect x="240" y="-62" width="150" height="58" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="240" y="-62" width="4" height="58" rx="2" fill="#7c3aed" />
      <text x="266" y="-36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Parse</text>
      <text x="266" y="-16" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">JSON → Order</text>
      <circle cx="240" cy="-34" r="6" fill="#fff" stroke="#7c3aed" stroke-width="2.5" />
    </g>
    <g>
      <rect x="236" y="140" width="150" height="58" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="236" y="140" width="4" height="58" rx="2" fill="#d97706" />
      <text x="262" y="166" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#0f172a">Validate</text>
      <text x="262" y="186" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">schema v4</text>
      <circle cx="236" cy="168" r="6" fill="#fff" stroke="#d97706" stroke-width="2.5" />
    </g>
  </g>
</svg>
